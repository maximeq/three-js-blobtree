<!DOCTYPE html>
<html lang="en">

<head>
    <title>Blobtree - Basic</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script type="importmap">
        {
          "imports": {
            "three": "../../node_modules/three/build/three.module.js",
            "three/": "../../node_modules/three/",
            "@dioxygen-software/three-js-blobtree": "../../dist/three-js-blobtree.module.js",
            "dat.gui": "../../node_modules/dat.gui/build/dat.gui.module.js"
          }
        }
    </script>
    <link rel="stylesheet" href="../../node_modules/dat.gui/build/dat.gui.css">
</head>

<script type="module">
    import { Vector3, MeshPhongMaterial, MeshBasicMaterial, Mesh } from "three"
    import * as Blobtree from "@dioxygen-software/three-js-blobtree"
    import * as dat from "dat.gui"

    var root = new Blobtree.RootNode();

    root.addChild(
        new Blobtree.ScalisPoint(
            new Blobtree.ScalisVertex(
                new Vector3(-12, 0, 0),
                6
            ),
            Blobtree.ScalisPrimitive.CONVOL,
            1.0,
            new Blobtree.Material({ color: '#4a8af4' })
        )
    );
    root.addChild(
        new Blobtree.ScalisSegment(
            new Blobtree.ScalisVertex(
                new Vector3(0, 10, 0),
                6
            ),
            new Blobtree.ScalisVertex(
                new Vector3(0, -10, 0),
                3
            ),
            Blobtree.ScalisPrimitive.CONVOL,
            1.0,
            [new Blobtree.Material({ color: '#dd4f43' }), new Blobtree.Material({ color: '#ffcd41' })]
        )
    );
    root.addChild(
        new Blobtree.ScalisTriangle(
            [
                new Blobtree.ScalisVertex(
                    new Vector3(12, 11, 0),
                    4
                ),
                new Blobtree.ScalisVertex(
                    new Vector3(12, -7, 0),
                    6
                ),
                new Blobtree.ScalisVertex(
                    new Vector3(24, 2, 0),
                    2
                )
            ],
            Blobtree.ScalisPrimitive.CONVOL,
            1.0,
            [new Blobtree.Material({ color: '#dd4f43' }), new Blobtree.Material({ color: '#ffcd41' }), new Blobtree.Material({ color: '#19a15f' })]
        )
    );

    root.prepareForEval();
    var res = { v: 0 };
    root.value(new Vector3(0, 22, 0), res);
    console.log(res.v);

    var smc = new Blobtree.SlidingMarchingCubes(
        root,
        {
            convergence: { step: 4 },
            detailRatio: 1.0    // Double resolution with respect to the primitives setup.
        }
    );

    // Compute the geometry using the SlidingMarchingCubes
    // geometry is kept as a global variable to be used in the following script.
    var geometry = smc.compute();
    geometry.computeBoundingBox();
    var material = new MeshBasicMaterial({ vertexColors: true });
    var material = new MeshPhongMaterial({ vertexColors: true });
    var mesh = new Mesh(geometry, material);
    globalThis.mesh = mesh

    // init GUI to change the Volume Type parameter
    var gui = new dat.GUI();

    var ScalisControls = function () {
        this.volType = "Convolution";
    };

    var scalisControls = new ScalisControls();
    var scalisFolder = gui.addFolder('SCALIS Control');

    scalisFolder.add(scalisControls, 'volType', ["Convolution", "Distance"]).onChange(function () {
        for (var i = 0; i < root.children.length; ++i) {
            root.children[i].setVolType(
                scalisControls.volType === "Convolution" ? Blobtree.ScalisPrimitive.CONVOL : Blobtree.ScalisPrimitive.DIST
            );
        }
        mesh.geometry = smc.compute();
        updateShadow();
    });

    scalisFolder.open();

</script>
<!-- Main script containing js setup for the page -->
<script type="module" src="./js/smc-main-script.js"></script>

<body>
    <div id="info">
        <a href="http://threejs.org" target="_blank" rel="noopener">three.js</a> - <a href="https://github.com/dualbox/three-js-blobtree" target="_blank"
            rel="noopener">Blobtree</a> - Scalis example
    </div>
</body>
