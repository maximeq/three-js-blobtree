<!DOCTYPE html>
<html lang="en">

<head>
    <title>Blobtree - Basic</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script type="importmap">
        {
          "imports": {
            "three": "../../node_modules/three/build/three.module.js",
            "three/": "../../node_modules/three/",
            "@dioxygen-software/three-js-blobtree": "../../dist/three-js-blobtree.module.js",
            "dat.gui": "../../node_modules/dat.gui/build/dat.gui.module.js"
          }
        }
    </script>
    <link rel="stylesheet" href="../../node_modules/dat.gui/build/dat.gui.css">
</head>

<script type="module" src="./js/SimpleFunctor.js"></script>

<script type="module">

    import { Vector3, MeshPhongMaterial, MeshBasicMaterial, Mesh, Object3D } from "three"
    import * as Blobtree from "@dioxygen-software/three-js-blobtree"
    import * as dat from "dat.gui"

    var root = new Blobtree.RootNode();
    var sdf_root = new Blobtree.MinNode(
        [
            new Blobtree.SDFRootNode(
                new Blobtree.Poly6DistanceFunctor(6.0),
                new Blobtree.Material({ color: '#ffcd41' }),
                new Blobtree.SDFSphere(
                    new Vector3(8, 0, 0),
                    12
                )
            ),
            new Blobtree.SDFRootNode(
                new Blobtree.Poly6DistanceFunctor(6.0),
                new Blobtree.Material({ color: '#dd4f43' }),
                new Blobtree.SDFSphere(
                    new Vector3(-8, 0, 0),
                    12
                )
            )
        ]
    );
    var ricci_root = new Blobtree.RicciNode(1,
        [
            new Blobtree.ScalisPoint(
                new Blobtree.ScalisVertex(
                    new Vector3(-8, 0, 0),
                    12
                ),
                Blobtree.ScalisPrimitive.DIST,
                1.0,
                new Blobtree.Material({ color: '#dd4f43' })
            ),
            new Blobtree.ScalisPoint(
                new Blobtree.ScalisVertex(
                    new Vector3(8, 0, 0),
                    12
                ),
                Blobtree.ScalisPrimitive.DIST,
                1.0,
                new Blobtree.Material({ color: '#ffcd41' })
            )
        ]
    );
    var twist_node = new Blobtree.TwistNode(
        [sdf_root]
    );

    root.addChild(twist_node);

    var smc = new Blobtree.SlidingMarchingCubes(
        root,
        {
            convergence: {},
            detailRatio: 0.25    // Double resolution with respect to the primitives setup.
        }
    );

    // Compute the geometry using the SlidingMarchingCubes
    // geometry is kept as a global variable to be used in the following script.
    var geometry = smc.compute();
    geometry.computeBoundingBox();
    var material = new MeshPhongMaterial({ vertexColors: true });
    var mesh = new Mesh(geometry, material);
    globalThis.mesh = mesh

    window.setInterval(function (a, b) {
        twist_node.setTwistAmount(0.6 * Math.cos(new Date().getTime() / 1500.0));
        mesh.geometry = smc.compute();
        updateShadow();
    }, 100);


    let guiProp = { twist_axis_x: 0.0, twist_axis_y: 1.0, twist_axis_z: 0.0, volType: "SDF" };
    let gui = new dat.GUI({ name: 'Twist Node', width: 350 });
    let twistParams = gui.addFolder("Twist Parameters");

    twistParams.add(guiProp, "twist_axis_x", -1.0, 1.0, 0.1).name("Twist Axis X").onChange(function () { twist_node.setTwistAxis(new Vector3(guiProp.twist_axis_x, guiProp.twist_axis_y, guiProp.twist_axis_z).normalize()); }).updateDisplay();
    twistParams.add(guiProp, "twist_axis_y", -1.0, 1.0, 0.1).name("Twist Axis Y").onChange(function () { twist_node.setTwistAxis(new Vector3(guiProp.twist_axis_x, guiProp.twist_axis_y, guiProp.twist_axis_z).normalize()); }).updateDisplay();
    twistParams.add(guiProp, "twist_axis_z", -1.0, 1.0, 0.1).name("Twist Axis Z").onChange(function () { twist_node.setTwistAxis(new Vector3(guiProp.twist_axis_x, guiProp.twist_axis_y, guiProp.twist_axis_z).normalize()); }).updateDisplay();
    twistParams.add(guiProp, 'volType', ["Ricci", "SDF"]).onChange(function () {
        if (guiProp.volType === 'Ricci') {
            twist_node.removeChild(sdf_root);
            twist_node.addChild(ricci_root);
        }
        else if (guiProp.volType === 'SDF') {
            twist_node.removeChild(ricci_root);
            twist_node.addChild(sdf_root);
        }

        mesh.geometry = smc.compute();
        updateShadow();
    })
</script>
<!-- Main script containing js setup for the page -->
<script type="module" src="./js/smc-main-script.js"></script>

<body>
    <div id="info">
        <a href="http://threejs.org" target="_blank" rel="noopener">three.js</a> - <a href="https://github.com/dualbox/three-js-blobtree" target="_blank"
            rel="noopener">Blobtree</a> - Twist Node example
    </div>
</body>
