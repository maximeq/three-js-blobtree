<!DOCTYPE html>
<html lang="en">

<head>
    <title>Blobtree - Ricci</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script type="importmap">
        {
          "imports": {
            "three": "../../node_modules/three/build/three.module.js",
            "three/": "../../node_modules/three/",
            "@dioxygen-software/three-js-blobtree": "../../dist/three-js-blobtree.module.js",
            "dat.gui": "../../node_modules/dat.gui/build/dat.gui.module.js"
          }
        }
    </script>
    <link rel="stylesheet" href="../../node_modules/dat.gui/build/dat.gui.css">
</head>

<script type="module">
    import { Vector3, MeshPhongMaterial, MeshBasicMaterial, Mesh } from "three"
    import * as Blobtree from "@dioxygen-software/three-js-blobtree"
    import * as dat from "dat.gui"

    var root = new Blobtree.RootNode();
    var ricci_node = new Blobtree.RicciNode(
        1,
        [
            new Blobtree.ScalisPoint(
                new Blobtree.ScalisVertex(
                    new Vector3(-8, 0, 0),
                    12
                ),
                Blobtree.ScalisPrimitive.DIST,
                1.0,
                new Blobtree.Material({ color: '#dd4f43' })
            ),
            new Blobtree.ScalisPoint(
                new Blobtree.ScalisVertex(
                    new Vector3(8, 0, 0),
                    12
                ),
                Blobtree.ScalisPrimitive.DIST,
                1.0,
                new Blobtree.Material({ color: '#ffcd41' })
            )
        ]
    );

    root.addChild(ricci_node);

    var smc = new Blobtree.SlidingMarchingCubes(
        root,
        {
            detailRatio: 0.25    // Double resolution with respect to the primitives setup.
        }
    );

    // Compute the geometry using the SlidingMarchingCubes
    // geometry is kept as a global variable to be used in the following script.
    var geometry = smc.compute();
    geometry.computeBoundingBox();
    var material = new MeshPhongMaterial({ vertexColors: true });
    var mesh = new Mesh(geometry, material);
    globalThis.mesh = mesh

    // init GUI to change the Ricci parameter
    var gui = new dat.GUI();

    var RicciControls = function () {
        this.ricciN = ricci_node.getRicciN();
    };

    var ricciControls = new RicciControls();
    var ricciFolder = gui.addFolder('Ricci Control');

    // Limit range of Ricci N to 8 since the SMC accuracy is not sufficient to capture the detail when
    ricciFolder.add(ricciControls, 'ricciN').min(1).max(8).step(1).onChange(function () {
        ricci_node.setRicciN(ricciControls.ricciN);
        mesh.geometry = smc.compute();
        updateShadow();
    });

    ricciFolder.open();

</script>
<!-- Main script containing js setup for the page -->
<script type="module" src="./js/smc-main-script.js"></script>

<body>
    <div id="info">
        <a href="http://threejs.org" target="_blank" rel="noopener">three.js</a> - <a href="https://github.com/dualbox/three-js-blobtree" target="_blank"
            rel="noopener">Blobtree</a> - Ricci Node example
    </div>
</body>

</style>

</html>
